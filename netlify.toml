[build]
  command = "npm run build"
  publish = "dist"

# ה-service worker חייב להיבדק מחדש בכל טעינה, אחרת עדכוני גרסה
# לא יגיעו למשתמשים שכבר התקינו את האפליקציה
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# קבצי הבנייה נושאים גיבוב בשם, ולכן אפשר לשמור אותם לנצח
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
